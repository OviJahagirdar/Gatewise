<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Guard login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="bar"><h1>Society Gate</h1></header>
  <main>
    <h2>Log in</h2>
    <div>
      <label for="username">Username</label>
      <input id="username" type="text" autocomplete="username" autocapitalize="none">
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password">
      <p id="msg" class="msg" role="alert"></p>
      <button id="go" class="primary full">Log in</button>
    </div>
  </main>

  <script src="app.js"></script>
  <script>
    // Already logged in? Skip straight to home.
    if (getToken()) location.href = "home.html";

    const msg = document.getElementById("msg");
    const btn = document.getElementById("go");

    async function doLogin() {
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;
      if (!username || !password) return showMsg(msg, "Enter your username and password.", "error");

      btn.disabled = true;
      showMsg(msg, "Logging in…");
      try {
        // Response: { token: "...", user: { id, username, full_name, role, society_id } }
        const data = await callApi("/login", {
          method: "POST",
          body: JSON.stringify({ username, password }),
        });
        localStorage.setItem("gate_token", data.token);
        localStorage.setItem("gate_user", JSON.stringify(data.user));
        location.href = "home.html";
      } catch (err) {
        showMsg(msg, err.message, "error");
        btn.disabled = false;
      }
    }

    btn.addEventListener("click", doLogin);
    document.getElementById("password").addEventListener("keydown", (e) => {
      if (e.key === "Enter") doLogin();
    });
  </script>
</body>
</html>
