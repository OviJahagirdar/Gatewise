<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Committee login — Society Gate</title>
</head>
<body>
<main>
  <div class="card auth-card">
    <h1>Committee login</h1>
    <p class="hint">Society Gate — the digital gate register for your society.</p>

    <form id="login-form">
      <div class="field">
        <label for="username">Username</label>
        <input id="username" name="username" autocomplete="username" required>
      </div>
      <div class="field field-gap">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <p id="message" class="message" hidden></p>
      <button type="submit" style="width:100%;margin-top:16px">Log in</button>
    </form>

    <p class="hint" style="margin-top:18px">
      New society? <a href="onboard.html">Create a new society</a>.
    </p>
  </div>
</main>

<script src="app.js"></script>
<script>
  // This page uses plain fetch() instead of callApi() on purpose: callApi()
  // redirects to login.html on a 401, and a wrong password IS a 401 here.
  const form = document.getElementById("login-form");

  form.addEventListener("submit", async function (event) {
    event.preventDefault();
    clearMessage("message");

    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value;

    try {
      const response = await fetch("/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username: username, password: password }),
      });

      const data = await response.json().catch(function () { return {}; });

      if (!response.ok) {
        throw new Error(data.detail || "Wrong username or password.");
      }

      const token = saveLogin(data);
      if (!token) throw new Error("The server did not return a login token.");

      // The committee pages are admin-only; a guard uses the guard pages.
      if (data.user && data.user.role !== "admin") {
        localStorage.removeItem(TOKEN_KEY);
        throw new Error("This is a guard login. Please use the guard app on the phone.");
      }

      window.location.href = "logs.html";
    } catch (error) {
      showMessage("message", error.message, true);
    }
  });
</script>
</body>
</html>
